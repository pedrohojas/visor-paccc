<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Visor de Medidas de Adaptación</title>
<meta name="description" content="Medidas de adaptación de los PACCC, PARCC y PSA de Chile por comuna.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: mapa de Chile en cuatro franjas a la izquierda como selector; a la derecha, pestañas con indicadores, lista, nivel superior, riesgo y método. */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --surface-2:#eef0ec; --line:#d9ddd6; --line-2:#c2c7bd;
  --fg:#15201d; --fg-2:#4d5a55; --fg-3:#7d8983;
  --accent:#1f5f8b; --accent-2:#e0ecf5; --accent-fg:#ffffff;
  --q1:#cde2fb; --q2:#86b6ef; --q3:#3987e5; --q4:#1c5cab; --q5:#0d366b;
  --g-ausente:#e6e8e3; --g-pend:#d3d6cf; --g-sinmed:#c3c7bf; --g-parcial-ring:#8c6a1a; --g-sinplan:#efe3d6; --g-excl:#b3b7af;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6; --c7:#e34948; --c8:#008300;
  --warn:#b8860b; --ok:#0ca30c;
  --font-display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:6px; --shadow:0 1px 2px rgba(21,32,29,.08),0 8px 24px rgba(21,32,29,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131917; --surface:#1b2220; --surface-2:#242c29; --line:#2f3936; --line-2:#44504b;
  --fg:#e8ebe7; --fg-2:#b4bcb7; --fg-3:#86918b;
  --accent:#5ea2d6; --accent-2:#1d3344; --accent-fg:#0d1a24;
  --q1:#1c3a5c; --q2:#1c5cab; --q3:#2a78d6; --q4:#5598e7; --q5:#9ec5f4;
  --g-ausente:#232a27; --g-pend:#2c3431; --g-sinmed:#36403c; --g-parcial-ring:#d9a93a; --g-sinplan:#3a2f26; --g-excl:#414a46;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#e66767; --c8:#008300;
  --warn:#e2b23c; --ok:#3dc13d; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131917; --surface:#1b2220; --surface-2:#242c29; --line:#2f3936; --line-2:#44504b;
  --fg:#e8ebe7; --fg-2:#b4bcb7; --fg-3:#86918b;
  --accent:#5ea2d6; --accent-2:#1d3344; --accent-fg:#0d1a24;
  --q1:#1c3a5c; --q2:#1c5cab; --q3:#2a78d6; --q4:#5598e7; --q5:#9ec5f4;
  --g-ausente:#232a27; --g-pend:#2c3431; --g-sinmed:#36403c; --g-parcial-ring:#d9a93a; --g-sinplan:#3a2f26; --g-excl:#414a46;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#e66767; --c8:#008300;
  --warn:#e2b23c; --ok:#3dc13d; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:20px;font-weight:600}
h2{font-size:15px;font-weight:600;letter-spacing:.01em}
h3{font-size:13px;font-weight:600;color:var(--fg-2)}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.mono{font-family:var(--font-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- cabecera ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
header.top .sub{color:var(--fg-2);font-size:12px}
header.top .badge{font-size:11px;padding:2px 8px;border:1px solid var(--line-2);border-radius:999px;color:var(--fg-2)}

/* ---------- filtros ---------- */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.filtros .buscar{flex:1 1 220px;min-width:0;display:flex;gap:6px}
.filtros input[type=search]{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface)}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .x{opacity:.7}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius);padding:5px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
details.fdrop{position:relative}
details.fdrop>summary{list-style:none;cursor:pointer}
details.fdrop>summary::-webkit-details-marker{display:none}
details.fdrop:not([open]) .panel{display:none}
details.fdrop .panel{position:absolute;z-index:20;top:calc(100% + 6px);left:0;min-width:280px;max-width:min(92vw,420px);max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 10px}
details.fdrop .panel label{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;font-size:12.5px;cursor:pointer}
details.fdrop .panel label .n{margin-left:auto;color:var(--fg-3);font-family:var(--font-mono);font-size:11px}
details.fdrop .panel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
details.fdrop .panel .grp{margin-top:6px}
details.fdrop .panel .src{font-size:11px;color:var(--fg-3);margin:4px 0 2px}
@media (max-width:600px){details.fdrop .panel{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;min-width:0;max-width:none;max-height:50vh}}

/* ---------- cuerpo ---------- */
.cuerpo{display:grid;grid-template-columns:minmax(320px,500px) minmax(0,1fr);gap:20px;margin-top:12px;align-items:start}
.cuerpo>*{min-width:0}
@media (max-width:900px){.cuerpo{grid-template-columns:1fr}}
.mapa-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px)}
@media (max-width:900px){.mapa-col{position:static}}
.mapa-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.mapa-head select{padding:4px 6px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface);font-size:12px;max-width:100%}
.mapa-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden}
.mapa-wrap svg{display:block;width:100%;height:auto}
.mapa-wrap .com{stroke:var(--surface);stroke-width:.4;cursor:pointer;transition:opacity .12s}
.mapa-wrap .com:hover{stroke:var(--fg);stroke-width:1}
.mapa-wrap .com.sel{stroke:var(--fg);stroke-width:1.2}
.mapa-wrap .reg{fill:none;stroke:var(--fg-2);stroke-width:.7;pointer-events:none}
.mapa-wrap .reg-hit{fill:transparent;stroke:none;cursor:pointer}
.mapa-wrap .reg-hit:hover{fill:rgba(31,95,139,.12)}
.mapa-wrap .lbl{font-family:var(--font-body);font-size:9px;fill:var(--fg);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:2.5px;stroke-linejoin:round}
.mapa-wrap .strip-lbl{font-family:var(--font-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;fill:var(--fg-3)}
.mapa-wrap .strip-line{stroke:var(--line);stroke-width:1}
.mapa-wrap .parcial{stroke:var(--g-parcial-ring);stroke-width:.9;stroke-dasharray:2 1.5}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 10px;font-size:12px;max-width:260px;display:none}
.tip b{font-weight:600}
.tip .t2{color:var(--fg-2);margin-top:2px}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:11px;color:var(--fg-2);margin-top:6px}
.leyenda .sw{display:inline-block;width:14px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.leyenda .sw.pend{background:repeating-linear-gradient(45deg,var(--g-pend) 0 2px,var(--surface) 2px 4px)}
.leyenda .sw.parcial{border:1.5px dashed var(--g-parcial-ring)}
.islas{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sel-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px}
.sel-bar .chips{display:flex;flex-wrap:wrap;gap:4px;max-height:84px;overflow:auto}

/* ---------- pestañas ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;color:var(--fg-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.vista{padding-top:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.kpi .v{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--fg-2);margin-top:2px}
.kpi .s{font-size:11px;color:var(--fg-3);margin-top:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0}
.card h2{margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.card h2 .src{font-weight:400;font-size:11px;color:var(--fg-3);margin-left:auto;cursor:help}
.bars{display:grid;grid-template-columns:minmax(90px,1.2fr) minmax(0,2fr) 44px;gap:3px 8px;align-items:center;font-size:12px}
.bars .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2);cursor:pointer}
.bars .k:hover{color:var(--accent);text-decoration:underline}
.bars .b{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:0}
.bars .b i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bars .n{text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2)}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;background:var(--surface-2)}
.stack i{display:block;height:100%}
.stack-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--fg-2);margin-top:6px}
.stack-leg .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;font-size:12px;background:var(--surface-2);cursor:pointer}
.tag .n{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-left:5px}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.aviso{font-size:12px;color:var(--fg-2);background:var(--surface-2);border-left:3px solid var(--warn);padding:8px 10px;border-radius:0 var(--radius) var(--radius) 0;margin-top:10px}
.vacio{color:var(--fg-3);font-size:13px;padding:14px 0}
.sint{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.sint .cab{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.sint p{margin:6px 0;max-width:78ch;line-height:1.55}
.sint ul{margin:4px 0 0;padding-left:18px}
.sint li{margin:3px 0;max-width:78ch}
.sint .lnk{color:var(--accent);cursor:pointer;font-family:var(--font-mono);font-size:11.5px;text-decoration:underline}
.sint .lnk.off{color:var(--fg-3);cursor:default;text-decoration:none}
.sint .meta{font-size:11px;color:var(--fg-3);margin-top:8px}
.ia-out{white-space:pre-wrap;line-height:1.55;max-width:80ch;font-size:13.5px}
details.sdet{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:8px 12px;margin-bottom:8px}
details.sdet summary{cursor:pointer;font-weight:600}

/* ---------- tabla ---------- */
.tbl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:11.5px;white-space:nowrap;cursor:pointer;user-select:none}
th .ord{color:var(--fg-3);font-size:10px}
tbody tr:hover{background:var(--accent-2)}
td.nom{min-width:240px;cursor:pointer}
td.nom:hover{color:var(--accent)}
.cod{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line-2);white-space:nowrap}
.pill.conf-baja{border-style:dashed}
.pill.sbn{background:var(--accent-2);border-color:transparent}
.pill.dir{background:var(--accent);color:var(--accent-fg);border-color:transparent}

/* ---------- ficha ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,13,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-width:860px;width:100%;padding:18px 20px;position:relative}
.modal .cerrar{position:absolute;top:10px;right:10px}
.modal h2{font-size:17px;margin-top:4px;padding-right:40px}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px;margin-top:12px}
.ficha .f{min-width:0}
.ficha .f .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3)}
.ficha .f .v{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.ficha .wide{grid-column:1/-1}
.clas{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.clas .r{display:grid;grid-template-columns:minmax(120px,160px) 1fr;gap:8px;font-size:12.5px;border-top:1px solid var(--line);padding-top:6px}
.clas .r .k{color:var(--fg-3);font-size:11.5px}
.cita{font-size:12.5px;color:var(--fg-2);border-left:3px solid var(--line-2);padding:4px 10px;margin-top:6px;font-style:italic}

/* ---------- método ---------- */
.metodo p{max-width:70ch}
.metodo table{font-size:12px}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-2);max-width:90ch}
.cargando{padding:40px;text-align:center;color:var(--fg-3)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <h1>Medidas de adaptación en los instrumentos de gestión del cambio climático — Chile</h1>
  <span class="sub" id="subtitulo">PACCC · PARCC · PSA</span>
  <span class="badge">Versión de trabajo · clasificaciones generadas por IA · ver Método</span>
</header>

<div class="filtros" id="filtros">
  <div class="buscar">
    <input type="search" id="q" placeholder="Buscar en nombre, código, indicador, meta o resumen…" aria-label="Buscar texto">
  </div>
  <button class="btn sm" id="preset-mop" title="Relevancia Agenda de Resiliencia directa o indirecta y amenazas A01, A02, A03, A09">Cartera MOP–MMA</button>
  <button class="btn sm" id="preset-sbn" title="es_sbn = sbn o potencial_sbn">SbN</button>
  <button class="btn sm" id="limpiar" hidden>Quitar filtros</button>
  <span id="fchips" style="display:contents"></span>
</div>

<div class="cuerpo">
  <aside class="mapa-col">
    <div class="mapa-head">
      <select id="metrica" aria-label="Métrica del mapa"></select>
      <button class="btn sm" id="btn-chile" title="Volver a la vista nacional">Chile</button>
      <button class="btn sm" id="btn-selreg" hidden>Seleccionar toda la región</button>
      <button class="btn sm" id="btn-limpiar-sel" hidden>Quitar selección</button>
    </div>
    <div class="mapa-wrap" id="mapa"><div class="cargando">Cargando geometría…</div></div>
    <div class="leyenda" id="leyenda"></div>
    <div class="islas" id="islas"><span class="eyebrow">Islas</span></div>
    <div class="sel-bar" id="selbar"></div>
  </aside>

  <main>
    <div class="tabs" id="tabs">
      <button data-v="resumen" class="on">Resumen</button>
      <button data-v="medidas">Medidas</button>
      <button data-v="superior">PARCC y PSA</button>
      <button data-v="riesgo">Riesgo declarado</button>
      <button data-v="metodo">Método y cobertura</button>
    </div>
    <div class="vista" id="vista"><div class="cargando">Cargando datos…</div></div>
  </main>
</div>

<footer id="pie"></footer>
<div class="tip" id="tip"></div>
<div id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(async function(){
"use strict";
const $=s=>document.querySelector(s), h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"—":Number(n).toLocaleString("es-CL");
const fmtCLP=n=>n==null?"—":(n>=1e9?(n/1e9).toLocaleString("es-CL",{maximumFractionDigits:2})+" mil M":n>=1e6?(n/1e6).toLocaleString("es-CL",{maximumFractionDigits:1})+" M":n.toLocaleString("es-CL"));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

let D,TOPO,DET=null;
try{
  [D,TOPO]=await Promise.all([fetch("datos.json").then(r=>r.json()),fetch("comunas.topojson").then(r=>r.json())]);
}catch(e){ $("#vista").innerHTML='<div class="vacio">No se pudieron cargar datos.json o comunas.topojson. Deben estar publicados junto a esta página.</div>'; return; }
let SINT=null; fetch("resumenes.json").then(r=>r.json()).then(d=>{SINT=d; render();}).catch(()=>{});
const ID2I=new Map();
fetch("detalle.json").then(r=>r.json()).then(d=>{DET=d; for(const k in d){ if(d[k].id_medida) ID2I.set(d[k].id_medida,+k); } render();}).catch(()=>{});

// ---------- índices ----------
const M=D.medidas, N=M.inst.length, I=D.instrumentos, DICC=D.dicc, ET=D.etiquetas, T=D.territorio;

const REG_ORDEN=["15","01","02","03","04","05","13","06","07","16","08","09","14","10","11","12"];
const ETIQ={tipo:"tipo_canonico",sector:"sector_lmcc",tema:"tema_ndc",intervencion:"tipo_intervencion_fao",naturaleza:"naturaleza_intervencion",es_sbn:"es_sbn",tipologia:"tipologia_sbn_sni",amenaza_principal:"amenaza_canonica",amenazas:"amenaza_canonica",pnacc_oe:"pnacc_oe",pnacc_le:"pnacc_le",pnacc_lt:"pnacc_lt",mop:"servicio_mop",financiamiento:"estado_financiamiento",relevancia_mop:null,confianza:null,vinculo:"vinculo_amenaza",enfoques:"enfoques_transversales"};
const PROC={tipo:"CLAUDE.md §4.1",amenazas:"PNACC DS 14/2025, ARClim, PSMA Ciudades (§4.2)",amenaza_principal:"PNACC DS 14/2025, ARClim, PSMA Ciudades (§4.2)",sector:"Ley 21.455, 12 sectores con PSA (§4.4)",tema:"Análisis de medidas PACCC, MMA ene-2026, ajustado (§4.5)",intervencion:"FAO/FVC Fomento de las SbN para Chile (§4.6)",naturaleza:"CLAUDE.md §4.7",es_sbn:"Guía SbN en planes de adaptación, MMA 2025 (§4.8)",tipologia:"Tipologías SbN para el SNI, FAO (§4.9)",mop:"Servicios MOP (§4.10)",financiamiento:"CLAUDE.md §4.11",pnacc_oe:"PNACC DS 14/2025 (§4.12)",pnacc_le:"PNACC DS 14/2025 (§4.12)",pnacc_lt:"PNACC DS 14/2025 pp. 42–55 (§4.12)",enfoques:"PSMA Ciudades p. 153 (§4.12)",relevancia_mop:"Regla 6, CLAUDE.md §6",confianza:"Nivel asignado por el modelo (§2)",vinculo:"CLAUDE.md §4.3",estado:"Inventario P1"};

const RELEV_ET={directa:"Directa",indirecta:"Indirecta",ninguna:"Ninguna"}, CONF_ET={alta:"Alta",media:"Media",baja:"Baja"};
function et(cat,v){ if(v==null) return "sin dato"; if(cat==="relevancia_mop") return RELEV_ET[v]||v; if(cat==="confianza") return CONF_ET[v]||v; if(cat==="tinst"||cat==="estado") return v;

function etShort(cat,v,max=38){ const s=et(cat,v); return s.length>max?s.slice(0,max-1)+"…":s; }
// valores por medida (decodificados), multi-valor para mop, pnacc_lt, amenazas, enfoques
const MULTI={mop:1,pnacc_lt:1,amenazas:1,enfoques:1};
const cache={};
function vals(cat){ if(cache[cat]) return cache[cat];
  let out;
  if(cat==="amenazas"||cat==="enfoques") out=M[cat].map(s=>s?s.split(";"):[]);
  else if(MULTI[cat]) out=M[cat].map(i=>{const v=DICC[cat][i]; return v?v.split(";"):[];});
  else if(cat==="tinst") out=M.inst.map(i=>instTipo[i]);
  else if(cat==="estado") out=M.inst.map(i=>I[i].estado);
  else out=M[cat].map(i=>DICC[cat][i]);
  return cache[cat]=out; }
const FILTRO_CATS=["tinst","estado","tipo","amenazas","vinculo","sector","tema","intervencion","naturaleza","es_sbn","tipologia","mop","relevancia_mop","financiamiento","pnacc_oe","pnacc_le","pnacc_lt","enfoques","confianza"];
const nombreN=M.nombre.map(norm), codN=M.codigo.map(norm);

// ---------- estado ----------
const state={sel:new Set(),filtros:{},q:"",vista:"resumen",metrica:"n",zoomReg:null,orden:{k:"comuna",asc:true},pag:1};
const ISLAS=["05201","05104"];

// ---------- filtrado ----------
function pasaFiltros(i){
  for(const cat in state.filtros){ const S=state.filtros[cat]; if(!S.size) continue;
    const v=vals(cat)[i];
    if(Array.isArray(v)){ if(!v.some(x=>S.has(x))) return false; } else if(!S.has(v)) return false; }
  if(state.q){ const q=state.q; if(!(nombreN[i].includes(q)||codN[i].includes(q)||(DET&&DET[i]&&(norm(DET[i].indicador).includes(q)||norm(DET[i].meta).includes(q)||norm(DET[i].resumen).includes(q)||norm(DET[i].objetivo).includes(q))))) return false; }
  return true;
}
let F=null; // medidas que pasan filtros temáticos (todos los instrumentos)
let porCut=new Map(); // conteos para el mapa (PACCC)
function recalcular(){
  F=[]; porCut=new Map(); const met=state.metrica;
  for(let i=0;i<N;i++){ if(!pasaFiltros(i)) continue; F.push(i);
    const inst=M.inst[i]; if(instTipo[inst]!=="PACCC") continue; const cut=instCut[inst]; if(!cut) continue;
    let w=1;
    if(met==="adapt") w=DICC.tipo[M.tipo[i]]==="adaptacion"?1:0;
    else if(met==="sbn") w=/^(sbn|potencial_sbn)$/.test(DICC.es_sbn[M.es_sbn[i]]||"")?1:0;
    else if(met==="mop") w=DICC.relevancia_mop[M.relevancia_mop[i]]==="directa"?1:0;
    else if(met==="costo") w=M.costo_clp[i]||0;
    if(w) porCut.set(cut,(porCut.get(cut)||0)+w);
  }
  if(met==="pob"){ for(const [cut,v] of porCut){ const p=tByCut.get(cut)?.pob; porCut.set(cut,p?v/p*1e4:0); } }
}
function enSeleccion(i){ const inst=M.inst[i]; if(instTipo[inst]!=="PACCC") return false; return state.sel.size===0||state.sel.has(instCut[inst]); }
function regionesSel(){ if(state.sel.size===0) return new Set(REG_ORDEN); const s=new Set(); state.sel.forEach(c=>s.add(tByCut.get(c)?.reg)); return s; }
function comunasSel(){ return state.sel.size? [...state.sel].map(c=>tByCut.get(c)).filter(Boolean) : T; }

// ---------- mapa ----------
const CONT=topojson.feature(TOPO,TOPO.objects.continente).features, REGS=topojson.feature(TOPO,TOPO.objects.regiones).features;
const regMesh=topojson.mesh(TOPO,TOPO.objects.regiones,(a,b)=>a!==b);
const STRIPS=[{n:"Norte",lat:[-17.45,-29.3]},{n:"Centro",lat:[-29.3,-36.6]},{n:"Centro sur",lat:[-36.6,-44.1]},{n:"Austral",lat:[-44.1,-56.1]}];
const W=420, H=740, PAD=14;
const tip=$("#tip");
function tooltip(ev,html){ tip.innerHTML=html; tip.style.display="block"; const r=tip.getBoundingClientRect(); let x=ev.clientX+14,y=ev.clientY+14; if(x+r.width>innerWidth-8) x=ev.clientX-r.width-10; if(y+r.height>innerHeight-8) y=ev.clientY-r.height-10; tip.style.left=x+"px"; tip.style.top=y+"px"; }
function tipOff(){ tip.style.display="none"; }
const ESTADO_ET={completo:"Plan leído completo",parcial:"Plan leído parcialmente",sin_medidas:"Plan sin medidas extraídas",pendiente:"Plan pendiente de lectura",sin_plan:"Carpeta sin plan",excluido:"Excluido del análisis",ausente:"Sin plan en el corpus"};
function colorComuna(cut,q){ const t=tByCut.get(cut); const v=porCut.get(cut)||0; const est=t?.estado||"ausente";
  if(est==="ausente") return "var(--g-ausente)"; if(est==="sin_plan") return "var(--g-sinplan)"; if(est==="excluido") return "var(--g-excl)";
  if(est==="pendiente") return "url(#hatch)"; if(est==="sin_medidas"&&!v) return "var(--g-sinmed)";
  if(!v) return "var(--q1)"; return `var(--q${q(v)})`; }
function escalaQ(){ const vs=[...porCut.values()].filter(v=>v>0).sort((a,b)=>a-b); if(!vs.length) return {q:()=>1,cortes:[]};
  const cortes=[.2,.4,.6,.8].map(p=>d3.quantileSorted(vs,p)); return {q:v=>1+cortes.filter(c=>v>c).length,cortes,min:vs[0],max:vs[vs.length-1]}; }
function tipComuna(ev,cut){ const t=tByCut.get(cut); const inst=I.find(i=>i.cut===cut&&i.tipo==="PACCC"); const v=porCut.get(cut)||0;
  const nf=F.filter(i=>instCut[M.inst[i]]===cut).length;
  tooltip(ev,`<b>${h(t?.comuna)}</b> · ${h(t?.region)}<div class="t2">${h(ESTADO_ET[t?.estado]||t?.estado||"")}${t?.causa?": "+h(t.causa):""}</div>${inst?`<div class="t2">${h(inst.nombre||inst.id)} · <i>${h(inst.estado||"")}</i></div>`:""}<div class="t2">${t?.nm?`${fmt(nf)} medidas con los filtros actuales (${fmt(t.nm)} en total)`:"sin medidas en la base"}${t?.n_decl&&t.n_decl!==t.nm?` · ${fmt(t.n_decl)} declaradas por el plan`:""}</div>${state.metrica!=="n"&&v?`<div class="t2">Valor de la métrica: ${state.metrica==="costo"?"$ "+fmtCLP(v):fmt(Math.round(v*100)/100)}</div>`:""}`); }
function dibujarMapa(){
  const wrap=$("#mapa"); const sc=escalaQ();

  const defs=svg.append("defs");

  if(state.zoomReg){
    const feats=CONT.filter(f=>f.properties.reg===state.zoomReg);
    const HR=540; svg.attr("viewBox",`0 0 ${W} ${HR}`);
    const proj=d3.geoMercator().fitExtent([[PAD,PAD+18],[W-PAD,HR-PAD]],{type:"FeatureCollection",features:feats}); const path=d3.geoPath(proj);
    svg.append("text").attr("class","strip-lbl").attr("x",PAD).attr("y",14).text("Región de "+regNombre[state.zoomReg]);
    const g=svg.append("g");
    g.selectAll("path").data(feats).join("path").attr("class",d=>"com"+(state.sel.has(d.id)?" sel":"")+(tByCut.get(d.id)?.estado==="parcial"?" parcial":""))
      .attr("d",path).attr("fill",d=>colorComuna(d.id,sc.q))
      .on("mousemove",(ev,d)=>tipComuna(ev,d.id)).on("mouseleave",tipOff).on("click",(ev,d)=>{toggleSel(d.id);});
    g.selectAll("text").data(feats.filter(f=>path.area(f)>900)).join("text").attr("class","lbl").attr("text-anchor","middle")
      .attr("transform",d=>`translate(${path.centroid(d)})`).attr("dy",3).text(d=>d.properties.nom);
  } else {
    const colW=(W-PAD*2)/4; const stripH=H-PAD-26;
    // cada franja se ajusta a su propio ancho: las escalas difieren entre franjas (es un selector, no un mapa a escala)
    const p0=d3.geoMercator().scale(1).translate([0,0]);
    const prep=STRIPS.map(s=>{ const feats=CONT.filter(f=>{const b=d3.geoBounds(f); return b[1][1]>s.lat[1]-0.5&&b[0][1]<s.lat[0]+0.5;});
      const bb=d3.geoBounds({type:"FeatureCollection",features:feats}); const lon0=Math.max(bb[0][0],-76.8), lon1=Math.min(bb[1][0],-66.4);
      const [ax,ay]=p0([lon0,s.lat[0]]), [bx,by]=p0([lon1,s.lat[1]]); const k=Math.min((colW-8)/(bx-ax),(stripH-8)/(by-ay)); return {feats,ax,ay,bx,by,k,alto:k*(by-ay)}; });
    const altoMax=Math.ceil(d3.max(prep,p=>p.alto))+8; svg.attr("viewBox",`0 0 ${W} ${altoMax+30+PAD}`);
    STRIPS.forEach((s,si)=>{
      const x0=PAD+si*colW; const id="clip"+si; const {feats,ax,ay,bx,k,alto}=prep[si];
      defs.append("clipPath").attr("id",id).append("rect").attr("x",x0).attr("y",26).attr("width",colW).attr("height",alto+8);
      const proj=d3.geoMercator().scale(k).translate([x0+colW/2-k*(ax+bx)/2,30-k*ay]);
      const path=d3.geoPath(proj);
      svg.append("text").attr("class","strip-lbl").attr("x",x0+colW/2).attr("y",14).attr("text-anchor","middle").text(s.n);
      if(si) svg.append("line").attr("class","strip-line").attr("x1",x0).attr("x2",x0).attr("y1",22).attr("y2",altoMax+30);
      const g=svg.append("g").attr("clip-path",`url(#${id})`);
      g.selectAll("path.com").data(feats).join("path").attr("class",d=>"com"+(state.sel.has(d.id)?" sel":"")+(tByCut.get(d.id)?.estado==="parcial"?" parcial":""))
        .attr("d",path).attr("fill",d=>colorComuna(d.id,sc.q))
        .on("mousemove",(ev,d)=>tipComuna(ev,d.id)).on("mouseleave",tipOff)

      g.append("path").attr("class","reg").attr("d",path(regMesh));
    });

  }

  const L=$("#leyenda"); const met=METRICAS.find(m=>m.k===state.metrica);

  if(sc.cortes.length){ const b=[sc.min,...sc.cortes,sc.max]; for(let i=0;i<5;i++) html+=`<span><span class="sw" style="background:var(--q${i+1})"></span>${state.metrica==="costo"?fmtCLP(b[i]):fmt(Math.round(b[i]*10)/10)}–${state.metrica==="costo"?fmtCLP(b[i+1]):fmt(Math.round(b[i+1]*10)/10)}</span>`; }
  html+=`<span><span class="sw" style="background:var(--q1)"></span>0 con filtros</span><span><span class="sw parcial"></span>lectura parcial</span><span><span class="sw" style="background:var(--g-sinmed)"></span>plan sin medidas extraídas</span><span><span class="sw pend"></span>pendiente</span><span><span class="sw" style="background:var(--g-sinplan)"></span>carpeta sin plan</span><span><span class="sw" style="background:var(--g-ausente)"></span>sin plan en el corpus</span>`;
  L.innerHTML=html;
}
const METRICAS=[{k:"n",l:"Medidas (con filtros)"},{k:"adapt",l:"Medidas de adaptación"},{k:"sbn",l:"Medidas SbN o potencial SbN"},{k:"mop",l:"Relevancia Agenda de Resiliencia directa"},{k:"costo",l:"Costo declarado (CLP)"},{k:"pob",l:"Medidas por 10.000 habitantes"}];
function toggleSel(cut){ if(state.sel.has(cut)) state.sel.delete(cut); else state.sel.add(cut); state.pag=1; refrescar(); }
function actualizarBotonesMapa(){ $("#btn-chile").hidden=!state.zoomReg; $("#btn-selreg").hidden=!state.zoomReg; $("#btn-limpiar-sel").hidden=!state.sel.size;
  $("#btn-selreg").textContent="Seleccionar toda la región"; }

// ---------- filtros UI ----------
function conteos(cat){ const c=new Map(); const V=vals(cat); for(let i=0;i<N;i++){ if(!enSeleccion(i)&&instTipo[M.inst[i]]==="PACCC") continue; const v=V[i]; (Array.isArray(v)?v:[v]).forEach(x=>c.set(x,(c.get(x)||0)+1)); } return c; }
function ordenValores(cat,keys){ const k=ETIQ[cat]; if(k&&ET[k]){ const ord=Object.keys(ET[k]); return keys.sort((a,b)=>(ord.indexOf(a)+1||99)-(ord.indexOf(b)+1||99)); } return keys.sort(); }
function dibujarFiltros(){
  const host=$("#fchips"); host.innerHTML="";
  FILTRO_CATS.forEach(cat=>{
    const S=state.filtros[cat]||new Set(); const c=conteos(cat); const keys=ordenValores(cat,[...c.keys()].filter(k=>k!=null));
    const d=document.createElement("details"); d.className="fdrop";
    const grupos=new Map(); keys.forEach(k=>{ const kk=ETIQ[cat]; const g=(kk&&ET[kk]&&ET[kk][k]&&ET[kk][k].grupo)||""; if(!grupos.has(g)) grupos.set(g,[]); grupos.get(g).push(k); });
    let panel=`<div class="ph"><span class="eyebrow">${h(LABEL[cat])}</span><span><button class="btn sm" data-act="todo">Ninguno</button></span></div><div class="src">Procedencia: ${h(PROC[cat]||"")}</div>`;
    grupos.forEach((ks,g)=>{ if(g&&grupos.size>1) panel+=`<div class="grp eyebrow">${h(g)}</div>`; ks.forEach(k=>{ panel+=`<label><input type="checkbox" value="${h(k)}" ${S.has(k)?"checked":""}> <span>${h(et(cat,k))}</span><span class="n">${fmt(c.get(k))}</span></label>`; }); });
    if(c.has(null)) panel+=`<label><input type="checkbox" value="__null" ${S.has(null)?"checked":""}> <span class="muted">sin dato</span><span class="n">${fmt(c.get(null))}</span></label>`;
    d.innerHTML=`<summary class="chip ${S.size?"on":""}">${h(LABEL[cat])}${S.size?` <span class="mono">${S.size}</span>`:""} ▾</summary><div class="panel">${panel}</div>`;
    d.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{ const v=inp.value==="__null"?null:inp.value; const set=state.filtros[cat]||(state.filtros[cat]=new Set()); if(inp.checked) set.add(v); else set.delete(v); if(!set.size) delete state.filtros[cat]; state.pag=1; refrescar(); });

  });

  const n=Object.keys(state.filtros).length+(state.q?1:0); $("#limpiar").hidden=!n;
}

function distrib(ids,cat){ const c=new Map(); const V=vals(cat); ids.forEach(i=>{ const v=V[i]; (Array.isArray(v)?v:[v]).forEach(x=>c.set(x,(c.get(x)||0)+1)); }); return [...c.entries()].sort((a,b)=>b[1]-a[1]); }

async function copiarCSV(ids){ const msg=$("#csv-msg"); try{ await navigator.clipboard.writeText(csvDe(ids)); msg.textContent="Copiado al portapapeles (separador ;)."; }catch(e){ const ta=document.createElement("textarea"); ta.value=csvDe(ids); ta.style.cssText="position:fixed;left:-9999px"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); msg.textContent="Copiado.";}catch(_){ msg.textContent="No se pudo copiar; selecciona la tabla manualmente."; } ta.remove(); } setTimeout(()=>msg.textContent="",4000); }

function vRiesgo(){
  const regs=regionesSel(); const cuts=new Set(comunasSel().map(c=>c.cut));
  const insts=I.filter(i=>(i.tipo==="PACCC"&&cuts.has(i.cut))||(i.tipo==="PARCC"&&regs.has(i.reg))); const ids=new Set(insts.map(i=>i.id));
  const A=D.amenaza_plan.filter(a=>ids.has(a.inst)); if(!A.length) return '<div class="vacio">Sin amenazas declaradas en los planes de la selección (capa de riesgo pendiente para algunos instrumentos).</div>';
  const NIV=["muy_alto","alto","medio","bajo","muy_bajo","oportunidad","no_declarado"]; const NIV_ET={muy_alto:"Muy alto",alto:"Alto",medio:"Medio",bajo:"Bajo",muy_bajo:"Muy bajo",oportunidad:"Oportunidad",no_declarado:"No declarado"};
  const porCod=d3.rollups(A,v=>v,a=>a.cod||"sin_codigo").sort((a,b)=>b[1].length-a[1].length);
  let html=`<div class="aviso" style="border-left-color:var(--c7)"><b>Códigos no verificados.</b> La asignación de cada amenaza declarada a un código canónico (columna izquierda) tiene errores conocidos en esta versión: por ejemplo, en Valdivia "Remoción en masa" quedó como A06 e "Isla de calor" como A03. Use el texto literal y la página para cualquier conclusión; la corrida se repetirá.</div><div class="aviso">Riesgo <b>declarado por cada plan</b>, interpretado por el modelo a partir de texto, tablas o imágenes (campo I). La escala de cada plan es distinta; los niveles homogéneos vendrán de ARClim en la Fase 2. ${fmt(A.length)} registros en ${fmt(new Set(A.map(a=>a.inst)).size)} planes.</div>
  <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Amenaza canónica</th>${NIV.map(n=>`<th>${NIV_ET[n]}</th>`).join("")}<th>Total</th></tr></thead><tbody>`;
  porCod.forEach(([cod,arr])=>{ const c=d3.rollup(arr,v=>v.length,a=>a.nivel||"no_declarado"); html+=`<tr><td>${cod==="sin_codigo"?'<span class="muted">sin código</span>':`<span class="cod">${h(cod)}</span> ${h(et("amenazas",cod))}`}</td>${NIV.map(n=>`<td class="num">${c.get(n)?fmt(c.get(n)):""}</td>`).join("")}<td class="num"><b>${fmt(arr.length)}</b></td></tr>`; });
  html+="</tbody></table></div>";
  const muestra=A.filter(a=>["muy_alto","alto"].includes(a.nivel)).slice(0,40);
  if(muestra.length){ html+=`<h2 style="margin:16px 0 6px">Amenazas con nivel alto o muy alto (hasta 40)</h2><div class="tbl-wrap"><table><thead><tr><th>Plan</th><th>Amenaza literal</th><th>Canónica</th><th>Nivel</th><th>Sistema afectado</th><th>Pág.</th></tr></thead><tbody>${muestra.map(a=>`<tr><td class="cod">${h(a.inst)}</td><td>${h(a.lit)}</td><td class="cod">${h(a.cod||"")}</td><td>${h(NIV_ET[a.nivel]||a.nivel)}</td><td class="small">${h(a.sistema||"")}</td><td class="num">${h(a.pagina||"")}</td></tr>`).join("")}</tbody></table></div>`; }
  return html;
}
function vMetodo(){
  const r=D.cobertura.resumen; const cob=D.cobertura;
  let html=`<div class="metodo">
  <h2>Qué es esta base</h2><p>Base estructurada de las medidas de los Planes de Acción Comunal (PACCC), Regionales (PARCC) y Sectoriales de Adaptación (PSA) de Chile, construida por lectura asistida por modelo de lenguaje de cada documento (Convenio MMA N°20260121_MMA_2_SbN_2026, programa DPS). Corte de datos: ${h(D.meta.generado)}. ${fmt(D.meta.n_medidas)} medidas, ${fmt(D.meta.n_acciones)} acciones y ${fmt(D.meta.n_amenazas)} amenazas declaradas en ${fmt(D.meta.n_instrumentos)} instrumentos.</p>
  <div class="aviso">${h(D.meta.aviso)} Clasificaciones generadas por un modelo de lenguaje a partir del texto de cada instrumento; cada etiqueta cita la página y el pasaje que la respalda y debe verificarse antes de su uso oficial.</div>
  <h2 style="margin-top:16px">Cobertura del corpus</h2>

  <div class="kpis">${Object.entries(r.comunas_por_estado).map(([k,v])=>`<div class="kpi"><div class="v">${fmt(v)}</div><div class="l">${h(ESTADO_ET[k]||k)}</div></div>`).join("")}</div>
  <h3 style="margin:14px 0 6px">Regiones (PARCC)</h3><div class="tbl-wrap"><table><thead><tr><th>Región</th><th>Instrumento</th><th>Estado</th><th>Medidas</th><th>Declaradas</th><th>Comunas con PACCC</th><th>Medidas comunales</th></tr></thead><tbody>${cob.regiones.map(x=>`<tr><td>${h(x.region)}</td><td class="cod">${h(x.id_instrumento||"")}</td><td>${h(x.estado)}</td><td class="num">${fmt(x.n_medidas)}</td><td class="num">${fmt(x.n_declaradas)}</td><td class="num">${fmt(x.comunas_con_paccc)} / ${fmt(x.comunas_total)}</td><td class="num">${fmt(x.medidas_comunales)}</td></tr>`).join("")}</tbody></table></div>
  <h3 style="margin:14px 0 6px">Sectores (PSA)</h3><div class="tbl-wrap"><table><thead><tr><th>Sector</th><th>Instrumento</th><th>Estado</th><th>Medidas</th><th>Declaradas</th></tr></thead><tbody>${cob.sectores.map(x=>`<tr><td>${h(et("sector",x.sector))}</td><td class="cod">${h(x.id_instrumento||"")}</td><td>${h(x.estado)}</td><td class="num">${fmt(x.n_medidas)}</td><td class="num">${fmt(x.n_declaradas)}</td></tr>`).join("")}</tbody></table></div>
  <h3 style="margin:14px 0 6px">Comunas con plan pero lectura incompleta</h3><div class="tbl-wrap"><table><thead><tr><th>Comuna</th><th>Región</th><th>Estado</th><th>Medidas</th><th>Declaradas</th><th>Causa</th></tr></thead><tbody>${T.filter(t=>["parcial","sin_medidas","pendiente","sin_plan","excluido"].includes(t.estado)).sort((a,b)=>a.reg.localeCompare(b.reg)).map(t=>`<tr><td>${h(t.comuna)}</td><td>${h(t.region)}</td><td>${h(ESTADO_ET[t.estado]||t.estado)}</td><td class="num">${fmt(t.nm)}</td><td class="num">${fmt(t.n_decl)}</td><td class="small">${h(t.causa||"")}</td></tr>`).join("")}</tbody></table></div>
  <h2 style="margin-top:18px">Campos y marcas</h2><p>Los campos <b>literales (L)</b> se extraen del documento tal cual: código, nombre, responsable, indicador, meta, plazo, costo, páginas. Los campos <b>interpretados (I)</b> son clasificaciones del modelo, cada una con nivel de confianza (alta, media, baja), cita textual de hasta 300 caracteres y página. La base no contiene todavía el objetivo ni la descripción de cada medida; los conceptos principales se calculan sobre nombre, indicador y meta.</p>
  <h2 style="margin-top:14px">Taxonomías y procedencia</h2><div class="tbl-wrap"><table><thead><tr><th>Campo</th><th>Procedencia</th><th>Valores</th></tr></thead><tbody>${FILTRO_CATS.filter(c=>c!=="tinst"&&c!=="estado").map(c=>`<tr><td>${h(LABEL[c])}</td><td class="small">${h(PROC[c]||"")}</td><td class="small">${h(ordenValores(c,[...conteos(c).keys()].filter(k=>k!=null)).map(k=>et(c,k)).join(" · "))}</td></tr>`).join("")}</tbody></table></div>
  <h2 style="margin-top:14px">Textos generados por IA</h2><p>El resumen y el objetivo de cada medida se extrajeron de las fichas con ${h(D.meta.modelo_resumenes?.modelo_medida||"un modelo de lenguaje")} (${fmt(D.meta.n_resumenes_medida)} medidas con resumen); el objetivo es copia literal del plan cuando existe y el resumen lleva confianza, cita y página. Las síntesis por región, comuna, PARCC y PSA (${fmt(D.meta.n_sintesis)}) se generaron con ${h(D.meta.modelo_resumenes?.modelo_territorio||"un modelo de lenguaje")} sobre todas las medidas de cada unidad. Dentro de claude.ai, el botón "Analizar esta selección" pide a Claude un análisis de la selección actual con la cuenta de quien lo usa; en la versión pública fuera de claude.ai ese botón no aparece.</p>
  <h2 style="margin-top:14px">Geometría y territorio</h2><p>Límites comunales de la Mapoteca de la Biblioteca del Congreso Nacional (SIIT, capa "comunas", 2019), reproyectados a WGS84 y simplificados para el visor; Rapa Nui y Juan Fernández como botones; la comuna Antártica no está en la capa y no tiene PACCC en el corpus. Códigos únicos territoriales según la División Político-Administrativa oficial; los códigos de la Región de Ñuble se verificaron contra la capa BCN y la tabla DPA publicada por MINSAL. ${D.meta.poblacion_fuente?"Población: "+h(D.meta.poblacion_fuente)+".":"La población comunal no está cargada; la métrica por habitante queda desactivada."}</p>
  <h2 style="margin-top:14px">Antecedentes</h2><p>"Análisis de medidas PACCC" y "Matriz de medidas PACCC" (MMA, DCC–Finanzas Climáticas, ene-2026: 74 PACCC, 1.817 medidas); FAO/FVC "Fomento de las SbN para Chile" (911 acciones de PSA y PARCC); DS N°14/2025 MMA, Plan Nacional de Adaptación 2025–2028; Guía para incorporar SbN en los planes de adaptación (MMA, 2025); Minuta Alianza estratégica MMA–MOP (borrador oct-2026).</p>
  </div>`;
  return html;
}
function ficha(i){ const inst=I[M.inst[i]]; const d=(DET&&DET[i])||{}; const t=tByCut.get(inst.cut);
  const f=(k,v,wide)=>v==null||v===""?"":`<div class="f ${wide?"wide":""}"><div class="k">${h(k)}</div><div class="v">${h(v)}</div></div>`;
  const cl=(cat,v)=>`<div class="r"><span class="k">${h(LABEL[cat]||cat)}</span><span>${Array.isArray(v)?v.map(x=>`<span class="cod">${h(x)}</span> ${h(et(cat,x))}`).join(" · "):`${v?`<span class="cod">${h(v)}</span> `:""}${h(et(cat,v))}`}</span></div>`;
  const cats=["tipo","amenazas","vinculo","sector","tema","intervencion","naturaleza","es_sbn","tipologia","mop","relevancia_mop","financiamiento","pnacc_oe","pnacc_le","pnacc_lt","enfoques"];
  const html=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-label="Ficha de medida"><button class="btn sm cerrar" id="mcerrar">Cerrar ✕</button>
    <div class="eyebrow">${h(inst.tipo)} · ${h(inst.comuna||inst.region||et("sector",inst.sector_psa))} · <span class="mono">${h(M.codigo[i]||"sin código")}</span></div>
    <h2>${h(M.nombre[i])}</h2>
    <div class="small muted" style="margin-top:4px">${h(inst.nombre||inst.id)} · ${h(inst.estado||"")} · páginas ${h(M.pagina_inicio[i]||"?")}–${h(M.pagina_fin[i]||"?")} · archivo <span class="mono">${h(inst.fuente||inst.id)}</span></div>
    ${d.resumen?`<div class="sint" style="margin-top:12px;margin-bottom:0"><div class="cab"><span class="eyebrow">Resumen (IA)</span><span class="pill conf-${h(d.resumen_conf)}">confianza ${h(CONF_ET[d.resumen_conf]||d.resumen_conf||"")}</span></div><p style="margin:2px 0">${h(d.resumen)}</p>${d.resumen_cita?`<div class="cita">«${h(d.resumen_cita)}» <span class="mono">p. ${h(d.resumen_pag||"?")}</span></div>`:""}</div>`:""}
    <div class="ficha">${f("Objetivo (texto del plan)",d.objetivo,true)}${f("Tipo según el plan",d.tipo_original)}${f("Responsable",d.responsable)}${f("Coadyuvantes",d.coadyuvantes)}${f("Plazo",d.plazo_literal?d.plazo_literal+(M.plazo_anios[i]?` (${M.plazo_anios[i]} años)`:""):(M.plazo_anios[i]?M.plazo_anios[i]+" años":null))}${f("Costo",d.costo_literal?d.costo_literal+(M.costo_clp[i]?` ≈ $ ${fmt(M.costo_clp[i])}`:""):(M.costo_clp[i]?"$ "+fmt(M.costo_clp[i]):null))}${f("Fuente de financiamiento",d.fuente_financiamiento)}${f("Indicador",d.indicador,true)}${f("Meta",d.meta,true)}</div>
    <h3 style="margin-top:14px">Clasificación (interpretada por el modelo) · confianza <span class="pill conf-${h(DICC.confianza[M.confianza[i]])}">${h(CONF_ET[DICC.confianza[M.confianza[i]]]||"sin dato")}</span></h3>
    <div class="clas">${cats.map(c=>cl(c,vals(c)[i])).join("")}</div>
    ${d.cita?`<div class="cita">«${h(d.cita)}» <span class="mono">p. ${h(d.cita_pagina||"?")}</span></div>`:""}${d.cita_sbn?`<div class="cita">SbN: «${h(d.cita_sbn)}»</div>`:""}
    <div class="small muted" style="margin-top:10px">id_medida: <span class="mono">${h(d.id_medida||"")}</span>${t?` · CUT ${h(t.cut)}`:""}</div>
  </div></div>`;
  $("#modal").innerHTML=html; $("#mcerrar").onclick=cerrar; $("#mbg").onclick=ev=>{ if(ev.target.id==="mbg") cerrar(); }; document.addEventListener("keydown",escCerrar); $("#mcerrar").focus(); }
